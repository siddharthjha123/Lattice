[tool.pytest.ini_options]
testpaths = ["tests", "backend"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice"
version = "0.3.2"
description = "Lattice worker and operator CLI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "docker>=7.1,<8", "psutil>=7,<8", "websockets>=17.4,<18", "httpx>=0.28,<1",
  "pywin32==312; sys_platform == 'win32'",
  "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "dnspython>=2.7,<3",
]

[project.scripts]
lattice = "lattice.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["lattice*", "worker_agent*", "shared*", "control_plane*", "orchestrator*"]
exclude = ["*.tests", "*.tests.*"]
